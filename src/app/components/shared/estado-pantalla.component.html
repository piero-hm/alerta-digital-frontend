@if (cargando()) {
  <div class="estado-pantalla" role="status" aria-live="polite">
    <div class="spinner-border text-primary" aria-hidden="true"></div>
    <p class="mt-3 mb-0 fw-semibold" style="color: var(--ad-text-2);">Cargando información...</p>
  </div>
} @else if (error()) {
  <div class="estado-pantalla" role="alert">
    <div class="error-box text-center">
      <span class="d-block mb-2" style="font-size:2rem;" aria-hidden="true">⚠️</span>
      <p class="mb-3" style="color: var(--ad-danger);">{{ error() }}</p>
      <button type="button" class="btn btn-secondary" (click)="reintentar.emit()">
        Reintentar
      </button>
    </div>
  </div>
} @else if (vacio()) {
  <div class="estado-pantalla" role="status">
    <span class="estado-vacio-ico" aria-hidden="true">📭</span>
    <p class="mb-3 fs-5" style="color: var(--ad-text-2);">{{ mensajeVacio() }}</p>
    <ng-content />
  </div>
}
