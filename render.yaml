services:
  - type: web
    name: alerta-digital-frontend
    runtime: static
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist/alerta-digital-frontend/browser
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: 22.23.1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
